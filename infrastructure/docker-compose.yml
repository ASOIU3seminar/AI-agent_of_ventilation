version: '3.8'

services:
  hvac-backend:
    build: 
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__GraphDb=Host=grafdb;Database=hvac;Username=postgres;Password=admin
      - LlmServiceUrl=http://llm-service:11434
    depends_on:
      - grafdb
      - llm-service

  grafdb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hvac
    ports:
      - "5432:5432" # Открыто для DBeaver
    volumes:
      - pgdata:/var/lib/postgresql/data

  llm-service:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Команда для автоматической загрузки модели при старте
    command: >
      sh -c "ollama serve & sleep 5 && ollama pull deepseek-coder && tail -f /dev/null"

volumes:
  pgdata:
  ollama_data: